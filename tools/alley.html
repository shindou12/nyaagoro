<!doctype html><html><body style="background:#000;margin:0">
<canvas id="c" width="320" height="180" style="width:1280px;height:720px;image-rendering:pixelated"></canvas>
<script type="module">
import { bakeSky, bakeAlley, bakeMoon, makeSigns, bakeCables, WINDOWS } from '../js/art/alleyArt.js';
import { bigCat, smallCat, backHead } from '../js/art/catArt.js';
import { actionIcon, fishIcon, swapIcon } from '../js/art/icons.js';
const ctx = document.getElementById('c').getContext('2d');
ctx.drawImage(bakeSky(),0,0); ctx.drawImage(bakeMoon(),226,6); ctx.drawImage(bakeAlley(),0,0);
for (const w of WINDOWS) { ctx.fillStyle=w.col; ctx.globalAlpha=.7; ctx.fillRect(w.x,w.y,w.w,w.h); ctx.globalAlpha=1; }
for (const s of makeSigns()) { ctx.globalCompositeOperation='lighter'; ctx.drawImage(s.glow, s.x-s.glow.pad, s.y-s.glow.pad); ctx.globalCompositeOperation='source-over'; ctx.drawImage(s.spr,s.x,s.y); }
ctx.drawImage(bakeCables(),0,0);
ctx.drawImage(bigCat('tama',{pose:'sit'},false),84-22,150-42);
ctx.drawImage(bigCat('hachi',{pose:'sit',look:-1},true),236-22,150-42);
[[95,110,'mike'],[211,94,'blue'],[190,114,'punk'],[60,138,'kiji'],[262,138,'sabi']].forEach(([x,y,b],i)=>ctx.drawImage(smallCat(b,{pose:i%2?'cheer':'sit'}),x-10,y-21));
for (let i=0;i<8;i++) ctx.drawImage(backHead(24,i), i*42-4, 160);
['nya','goro','goronya'].forEach((a,i)=>ctx.drawImage(actionIcon(a),120+i*22,30));
ctx.drawImage(fishIcon('full'),10,10); ctx.drawImage(fishIcon('bone'),30,10); ctx.drawImage(swapIcon(),190,34);
</script></body></html>
