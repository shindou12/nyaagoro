<!doctype html><html><body style="background:#140f33;margin:0">
<canvas id="c" width="320" height="180" style="width:1280px;height:720px;image-rendering:pixelated"></canvas>
<script type="module">
import { bigCat, smallCat, PLAYER_CATS, AUDIENCE_BREEDS, AUDIENCE_ACCS, backHead } from '../js/art/catArt.js';
const ctx = document.getElementById('c').getContext('2d');
ctx.fillStyle = '#231a4a'; ctx.fillRect(0,0,320,180);
const sp = [{pose:'sit'},{pose:'cheer',eyes:'happy',mouth:'o'},{pose:'jump',eyes:'wide',mouth:'o',ears:'perk'},{pose:'stick',eyes:'happy',arms:0},{pose:'sad',eyes:'closed',ears:'flat'},{pose:'sleep',eyes:'closed'},{pose:'peek',eyes:'open',look:1},{pose:'sit', eyes:'glow'}];
AUDIENCE_BREEDS.forEach((id, r) => sp.forEach((p, i) => ctx.drawImage(smallCat(id, p, false, {acc: AUDIENCE_ACCS[(r+i)%AUDIENCE_ACCS.length]}), 2 + i * 22 + (r>=8?170:0), 2 + (r%8) * 22)));
for (let i=0;i<5;i++) ctx.drawImage(backHead(22+i*2, i), 2+i*30, 180-24);
</script></body></html>
